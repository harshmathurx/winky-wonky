name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    name: Test & build (winky-wonky)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test (all workspaces)
        run: npm run test:all

      - name: Build (library)
        run: npm run build:lib --workspace=winky-wonky

      - name: Generate type declarations
        run: npm run types --workspace=winky-wonky

      - name: Build (Storybook)
        run: npm run build-storybook

  react-package-build:
    name: Build (winky-wonky-react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=winky-wonky-react

      - name: Verify built output has no JSX syntax
        run: node --check packages/winky-wonky-react/dist/index.js

      - name: Generate type declarations
        run: npm run types --workspace=winky-wonky-react
