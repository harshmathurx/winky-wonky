name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:all

      # changesets/action either:
      #  - opens/updates a "Version Packages" PR when unreleased changesets
      #    exist on main, or
      #  - if that PR was just merged (versions already bumped, no pending
      #    changesets left), runs `changeset publish` to publish to npm.
      # Either way, publish only ever happens as a result of a version bump
      # landing on main — never directly from a feature branch.
      #
      # `version`/`publish` call the changeset CLI directly (not via an
      # `npm run` script wrapper) — npm's own "> script\n> real command\n"
      # banner in front of the actual output broke this action's ability to
      # detect which packages published, so it never pushed tags or created
      # GitHub Releases even on a successful publish.
      - name: Create Version PR or Publish
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
